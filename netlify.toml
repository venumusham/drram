[build]
  # By running this simple echo command, we prevent Netlify from 
  # triggering our heavy `vite build && node scripts/prerender.mjs` flow.
  # This serves the already pre-built `dist` folder we push to GitHub.
  command = "echo 'Skipping build layer, serving precompiled local dist folder'"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The client calls /api/* (the Vercel convention). On Netlify those paths have
# to be routed to the equivalent function explicitly.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
